name: Verificar scrapers (CI)

# NOTA: Los scrapers se ejecutan en el servidor AGS mediante cron, NO aquí.
# Este workflow solo comprueba la sintaxis y coherencia del código en cada push.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar-sintaxis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml

      - name: Verificar sintaxis de todos los scrapers
        run: |
          python -m py_compile scraper_saih.py
          python -m py_compile scraper_sinac.py
          python -m py_compile scraper_sentinel2.py
          python -m py_compile scraper_aemet.py
          python -m py_compile scraper_sira.py
          python -m py_compile scraper_embalses.py
          python -m py_compile alertas.py
          echo "Sintaxis correcta en los 7 scrapers + alertas.py"

      - name: Verificar que config.json no está en el repositorio
        run: |
          if git ls-files config.json | grep -q config.json; then
            echo "ERROR: config.json está trackeado en git — contiene credenciales"
            exit 1
          fi
          echo "OK: config.json no está en el repositorio"

      - name: Verificar que datos.json y serie.json no están en el repositorio
        run: |
          if git ls-files datos.json serie.json | grep -q ".json"; then
            echo "ERROR: datos.json o serie.json están trackeados en git"
            exit 1
          fi
          echo "OK: datos de explotación no están en el repositorio"

      # scraper_saih.py y alertas.py son para el servidor AGS (necesitan config.json,
      # que nunca va a GitHub): aquí solo se comprueba su sintaxis.
      # En GitHub Actions los embalses los lee scraper_embalses.py.
      - name: Probar scraper_embalses.py con fixture (sin red)
        run: |
          mkdir -p /tmp/emb && cd /tmp/emb
          python "$GITHUB_WORKSPACE/scraper_embalses.py" --fixture "$GITHUB_WORKSPACE/EmbalNiv.html"
          python - <<'PY'
          import json
          d = json.load(open('data/embalses.json', encoding='utf-8'))
          por = {e['id']: e for e in d['embalses']}
          assert 'E33' in por, 'Falta Sierra Boyera'
          assert 'E34' in por, 'Falta Puente Nuevo'
          assert por['E2-40']['capacidad'] == 57.7, 'Capacidad de La Colada incorrecta'
          for k in ('E33', 'E34'):
              e = por[k]
              assert abs(e['volumen'] / e['capacidad'] * 100 - e['pct']) <= 1.0, k
          print('OK:', ', '.join(f"{e['nombre']} {e['pct']}" for e in d['embalses']))
          PY
