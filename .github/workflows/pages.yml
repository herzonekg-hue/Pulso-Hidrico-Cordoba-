name: Desplegar panel en GitHub Pages

# Despliega el panel (index.html + data/) en GitHub Pages
# tras cada push a main que modifique archivos del panel.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - ".nojekyll"
  workflow_dispatch:
  # Los commits que hace github-actions[bot] con GITHUB_TOKEN no disparan "push",
  # así que sin esto los datos que guardan los workflows de datos no llegan a la web.
  workflow_run:
    workflows:
      - "Actualizar datos SIRA"
      - "Actualizar datos SINAC"
      - "Actualizar embalses (SAIH Guadalquivir)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue simultáneo. No se cancela el que está en curso: cancelarlo
# (SIRA y embalses terminan casi a la vez) hacía fallar el despliegue de Pages
# con «Deployment failed, try again later» y la web se quedaba con datos viejos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto del panel
        # Solo publicamos lo estrictamente necesario para el panel:
        # index.html, .nojekyll y el directorio data/ (JSONs de scrapers).
        # Los scrapers .py, docs/ y demás solo son para el servidor AGS.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          if [ -d data ] && [ "$(ls -A data)" ]; then
            cp -r data _site/
          else
            mkdir -p _site/data
          fi
          echo "Contenido de _site:"
          ls -la _site/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
