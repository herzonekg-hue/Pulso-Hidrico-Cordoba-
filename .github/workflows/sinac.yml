name: Actualizar datos SINAC

# Ejecuta scraper_sinac.py en GitHub Actions y guarda data/sinac_calidad.json.
# No necesita Playwright: usa la API REST pública de sinac.sanidad.gob.es.

on:
  schedule:
    - cron: "0 5,17 * * *"   # 06:00 y 18:00 hora España (UTC+1) ≈ 05:00 y 17:00 UTC
  workflow_dispatch:           # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  sinac:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar scraper SINAC
        continue-on-error: true
        env:
          HIDRICO_SALIDA: data
        run: python scraper_sinac.py

      - name: Validar y guardar
        run: |
          if [ ! -f data/sinac_calidad.json ]; then
            echo "No se generó sinac_calidad.json: revisar el log del scraper."
            exit 1
          fi
          # Validar que tiene municipios con datos reales
          if ! python3 -c "
          import json, sys
          d = json.load(open('data/sinac_calidad.json', encoding='utf-8'))
          munis = d.get('municipios', [])
          con_datos = [m for m in munis if m.get('semaforo', {}).get('color') != 'GRIS' or m.get('calificacion')]
          print(f'Municipios totales: {len(munis)}, con datos: {len(con_datos)}')
          sys.exit(0 if len(munis) > 0 else 1)
          "; then
            echo "SINAC no devolvió municipios. No se guarda."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sinac_calidad.json
          if git diff --cached --quiet; then
            echo "Sin cambios en sinac_calidad.json"
          else
            git commit -m "datos: actualizar SINAC (automático)"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push && break
              sleep 5
            done
          fi
