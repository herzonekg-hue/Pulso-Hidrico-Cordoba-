name: Actualizar datos SIRA

# Ejecuta scraper_sira.py en GitHub Actions y guarda data/sira.json solo si llega al menos una estación con datos.
# Alternativa al cron del servidor AGS: no usar ambos a la vez.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sira:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar scraper SIRA
        # exit 1 = alerta, exit 2 = crítico — ambos son datos válidos.
        # La validación de si hay datos la hace el paso siguiente.
        continue-on-error: true
        env:
          HIDRICO_SALIDA: data
          # SIRA_AUTHJWT ya no es necesario: el scraper obtiene el token
          # automáticamente vía POST /backend/security/getProfile (sesión pública).
          # Si se configura como secreto, tiene prioridad (útil para debugging).
          SIRA_AUTHJWT: ${{ secrets.SIRA_AUTHJWT }}
        run: python scraper_sira.py

      - name: Validar y guardar
        run: |
          if [ ! -f data/sira.json ]; then
            echo "No se generó data/sira.json: revisar el log del scraper."
            exit 1
          fi
          if ! python3 -c "import json,sys; d=json.load(open('data/sira.json',encoding='utf-8')); sys.exit(0 if any(x.get('ok') for k in ('embalses','calidad','aforos') for x in d.get(k,[])) else 1)"; then
            echo "SIRA no devolvió datos válidos (401/404 en el log). No se guarda nada."
            rm -f data/sira.json
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sira.json
          git add data/eaa_*_serie.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios en sira.json"
          else
            git commit -m "datos: actualizar SIRA (automático)"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push && break
              sleep 5
            done
          fi
