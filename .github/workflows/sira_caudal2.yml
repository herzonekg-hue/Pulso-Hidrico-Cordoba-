name: SIRA caudal 2
on:
  push:
    branches: [analisis-lluvia]
    paths: ["analisis/sira_caudal2.py", ".github/workflows/sira_caudal2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          set -o pipefail
          python analisis/sira_caudal2.py 2>&1 | tee analisis/sira_caudal2_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analisis/sira_caudal2.json analisis/sira_caudal2_log.txt
          git commit -m "analisis: caudal y variables SIRA" || exit 0
          git pull --rebase origin analisis-lluvia || true
          git push origin analisis-lluvia
